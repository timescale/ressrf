[package]
name = "ressrf-python"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
ressrf-core = { path = "../crates/ressrf-core", features = ["std"] }
serde_json = "1"

[lints.rust]
unsafe_code = "allow"
