[build-system]
requires = ["maturin>=1.13.2,<2.0"]
build-backend = "maturin"

[project]
name = "ressrf"
version = "0.1.0"
description = "Multi-platform SSRF prevention library"
readme = "../README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Mostafa Moradian", email = "mstfmoradian@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
keywords = ["ssrf", "security", "network", "validation"]

[project.optional-dependencies]
httpx = ["httpx>=0.24"]
requests = ["requests>=2.28"]
ssh = ["paramiko>=3.0"]
all = ["httpx>=0.24", "requests>=2.28", "paramiko>=3.0"]
dev = ["pytest>=7", "pytest-asyncio>=0.21"]

[project.urls]
Repository = "https://github.com/timescale/ressrf"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "."
module-name = "ressrf._core"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.rules]
unresolved-import = "ignore"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
