name: Update IP Ranges

on:
  schedule:
    - cron: "0 4 1 * *" # 04:00 UTC on the 1st of every month
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-ip-ranges
  cancel-in-progress: true

jobs:
  update:
    name: Fetch and update IP ranges
    runs-on: ubuntu-latest
    permissions:
      contents: write # create branch and push
      pull-requests: write # open PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run codegen script
        run: python scripts/generate_ip_ranges.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet crates/ressrf-core/config/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate and test
        if: steps.diff.outputs.changed == 'true'
        run: |
          python scripts/generate_ip_ranges.py --validate-only
          rustup toolchain install stable --profile minimal
          cargo test --workspace --all-features --locked

      - name: Create branch and PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/update-ip-ranges-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add crates/ressrf-core/config/
          git commit -m "chore: update IP ranges from upstream sources"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore: update IP ranges ($(date +%Y-%m-%d))" \
            --body "Automated monthly update of IANA special-purpose registries and cloud provider service IP ranges." \
            --label "dependencies"
