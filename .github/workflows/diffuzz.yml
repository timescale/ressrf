name: Diff-Fuzz (Go native vs WASM oracle)

# Differential-fuzz harness: the native Go port at go-native/ressrf/
# against the Rust ressrf-core compiled to WASM (the same artifact the
# wazero binding embeds at go/ressrf/core.wasm). Catches parser drift
# the conformance vectors cannot see.
#
# Triggered on:
#   - changes to either side of the parser comparison: native engine,
#     wazero binding's WASM artifact, Rust core, or wasm-ABI crate
#   - weekly Monday 04:00 UTC (one hour after the cargo-fuzz job)
#   - manual workflow_dispatch
#
# Divergence findings fail the job: a fresh parser divergence
# blocks the merge that introduced it.

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "go-native/ressrf/policy.go"
      - "go-native/ressrf/errors.go"
      - "go-native/ressrf/deny_reasons.go"
      - "go-native/ressrf/internal/engine/**"
      - "go-native/ressrf/internal/diff/**"
      - "go-native/ressrf/go.mod"
      - "go/ressrf/core.wasm"
      - "crates/ressrf-core/**"
      - "crates/ressrf-wasm/**"

permissions: {}

concurrency:
  group: diffuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diffuzz:
    name: Native Go vs WASM oracle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.0.2
        with:
          go-version-file: go-native/ressrf/go.mod
          cache-dependency-path: go-native/ressrf/go.sum

      # Oracle is the in-tree go/ressrf/core.wasm artifact — no
      # /tmp/ressrf clone, no cargo step, no Rust toolchain install.
      - name: Replay persisted divergence corpus
        working-directory: go-native/ressrf
        run: make fuzz-rust-regress

      - name: Live fuzz against the WASM oracle
        working-directory: go-native/ressrf
        env:
          FUZZ_RUST_DURATION: "5m"
        run: make fuzz-rust

      - name: Upload divergence corpus
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diffuzz-divergences
          path: go-native/ressrf/internal/diff/testdata/fuzz/FuzzPolicyDiff/
          retention-days: 30
