[package]
name = "ressrf-http"
description = "HTTP protocol integration with Tower Layer, DNS-pinned resolver, and redirect interceptor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints.rust]
# Pin projection in the Tower future requires unsafe
unsafe_code = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_const_for_fn = "allow"
option_if_let_else = "allow"

[dependencies]
ressrf-core = { workspace = true, features = ["std"] }
ressrf-tcp = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
http = "1"
tower-service = "0.3"
tower-layer = "0.3"
pin-project-lite = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
