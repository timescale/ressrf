[package]
name = "ressrf-tcp"
description = "Async TCP guard with DNS-pinned dialing for SSRF prevention"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

[features]
default = []
hickory = ["hickory-resolver"]
# Tier 2 e2e tests that spin up CoreDNS + WireMock containers via
# testcontainers-rs. Requires Docker. Disabled by default so the
# regular `cargo test` matrix stays hermetic.
e2e = ["dep:testcontainers", "dep:reqwest", "hickory"]

[dependencies]
ressrf-core = { workspace = true, features = ["std"] }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
hickory-resolver = { version = "0.26", optional = true }
testcontainers = { version = "0.27", optional = true }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
